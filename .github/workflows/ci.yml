name: CI
on: [push, pull_request]

jobs:
  core:                                   # routing core + tool state machine, no Qt installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - run: python -m pytest -q

  qt:
    name: ${{ matrix.qt }} / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        qt: [pyqt6, pyside6, pyqt5]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[${{ matrix.qt }},test]"
      - run: python -m pytest -q
      - name: Smoke-test the demo window
        run: python examples/demo.py --smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build && twine check dist/*
